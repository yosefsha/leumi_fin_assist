name: Live tests

# The live query tier (tests/test_queries.py, #11): the required queries end to
# end against Anthropic and Tavily. Every run spends LLM tokens and Tavily quota,
# so it runs only when someone asks (docs/adr/0004-hybrid-test-tiers-and-ci.md):
# - a manual "Run workflow" (workflow_dispatch) always runs it;
# - a push to main that touches src/ or prompts/ runs it only when the repository
#   variable RUN_LIVE_TESTS is 'true'. Leave the variable unset or 'false' and
#   those pushes show the job as skipped.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "prompts/**"

permissions:
  contents: read

# Never cancel a paid run halfway; queue the next one instead.
concurrency:
  group: live-tests
  cancel-in-progress: false

jobs:
  live:
    name: Live query tests
    if: github.event_name == 'workflow_dispatch' || vars.RUN_LIVE_TESTS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_XET: "1"

    steps:
      # Fails loudly rather than skipping, for the reason claude-review.yml gives:
      # a green run that tested nothing is worse than an obvious failure.
      - name: Verify API key secrets are set
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          missing=""
          [ -n "$ANTHROPIC_API_KEY" ] || missing="$missing ANTHROPIC_API_KEY"
          [ -n "$TAVILY_API_KEY" ] || missing="$missing TAVILY_API_KEY"
          if [ -n "$missing" ]; then
            for name in $missing; do
              echo "::error::Repository secret $name is not set, so the live tests cannot run. Add it in Settings → Secrets and variables → Actions, or run: gh secret set $name --repo ${{ github.repository }}"
            done
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Read the embedding model name
        id: model
        run: echo "name=$(PYTHONPATH=src python -c 'from utils.fastembed_embedder import DEFAULT_MODEL; print(DEFAULT_MODEL)')" >> "$GITHUB_OUTPUT"

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: .index/models
          key: fastembed-${{ runner.os }}-${{ steps.model.outputs.name }}

      # pytest exits 5 when it collects no tests. That is a failure here too:
      # a run that verified nothing must not look like a pass.
      - name: Live tests
        env:
          RUN_LIVE_TESTS: "true"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          status=0
          pytest -m live || status=$?
          if [ "$status" -eq 5 ]; then
            echo "::error::No live tests were collected. tests/test_queries.py arrives with issue #11."
          fi
          exit "$status"
