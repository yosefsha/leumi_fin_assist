name: CI

# The regression gate: ruff and the offline test tier on every pull request and
# every push to main. No API keys and no paid calls; the only network use is the
# embedding-model download, which is cached (docs/adr/0004-hybrid-test-tiers-and-ci.md).
# The live query tests run in live-tests.yml, never here.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR supersedes the run it invalidated. Runs on main are never
# cancelled, so every merge commit gets a verdict.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline:
    name: Lint and offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Hugging Face's Xet transfer has stalled on this model's download; plain
      # HTTPS is reliable (noted in PR #20).
      HF_HUB_DISABLE_XET: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies and the finassist command
        run: |
          pip install -r requirements.txt ruff
          pip install -e .

      # The installed command starts and finds its prompts from outside the project.
      - name: Smoke-test the finassist command
        working-directory: ${{ runner.temp }}
        run: finassist --help

      - name: Lint
        run: ruff check .

      # Key the cache on the model the code actually uses, read from the code
      # rather than repeated here, so changing the model invalidates the cache.
      - name: Read the embedding model name
        id: model
        run: echo "name=$(PYTHONPATH=src python -c 'from utils.fastembed_embedder import DEFAULT_MODEL; print(DEFAULT_MODEL)')" >> "$GITHUB_OUTPUT"

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          # Where the tests load the model from (tests/conftest.py: .index/models).
          path: .index/models
          key: fastembed-${{ runner.os }}-${{ steps.model.outputs.name }}

      - name: Offline tests
        run: pytest -m "not live"
