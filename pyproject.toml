# Tool configuration only; dependencies live in requirements.txt.

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Repository-template tooling, not part of the agent.
extend-exclude = [".claude", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
# The entry point is `python src/main.py`, so imports are rooted at src/.
pythonpath = ["src"]
testpaths = ["tests"]
